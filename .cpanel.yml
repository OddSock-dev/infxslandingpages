---
deployment:
  tasks:
    - export DEPLOYPATH=/home/infxsolutionsco/public_html/zoho.infxsolutions.co.za

    # Clean old app files from deploy path, preserving .env, storage, and vendor
    - find $DEPLOYPATH -maxdepth 1 -mindepth 1 ! -name '.env' ! -name '.env.backup' ! -name '.env.production' ! -name 'storage' ! -name 'vendor' -exec rm -rf {} +

    # Copy application directories
    - cp -r $REPOROOT/app $DEPLOYPATH/app
    - cp -r $REPOROOT/bootstrap $DEPLOYPATH/bootstrap
    - cp -r $REPOROOT/config $DEPLOYPATH/config
    - cp -r $REPOROOT/database $DEPLOYPATH/database
    - cp -r $REPOROOT/public $DEPLOYPATH/public
    - cp -r $REPOROOT/resources $DEPLOYPATH/resources
    - cp -r $REPOROOT/routes $DEPLOYPATH/routes

    # Copy application root files
    - cp $REPOROOT/artisan $DEPLOYPATH/artisan
    - cp $REPOROOT/composer.json $DEPLOYPATH/composer.json
    - cp $REPOROOT/composer.lock $DEPLOYPATH/composer.lock
    - cp $REPOROOT/.editorconfig $DEPLOYPATH/.editorconfig

    # Ensure storage directory structure exists
    - mkdir -p $DEPLOYPATH/storage/framework/{cache,sessions,views}
    - mkdir -p $DEPLOYPATH/storage/logs
    - mkdir -p $DEPLOYPATH/storage/app/public

    # Install PHP dependencies (no dev packages in production)
    - /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction --working-dir=$DEPLOYPATH

    # Run database migrations
    - cd $DEPLOYPATH && php artisan migrate --force

    # Clear and rebuild caches
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache
    - cd $DEPLOYPATH && php artisan event:cache
    - cd $DEPLOYPATH && php artisan icons:cache
    - cd $DEPLOYPATH && php artisan filament:cache-components

    # Link public storage if not already linked
    - cd $DEPLOYPATH && php artisan storage:link 2>/dev/null || true

    # Restart queue workers to pick up new code
    - cd $DEPLOYPATH && php artisan queue:restart
