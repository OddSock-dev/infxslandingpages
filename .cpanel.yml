    - cd /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za && php artisan config:cache
    - cd /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za && php artisan route:cache
    - cd /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za && php artisan view:cache
    - cd /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za && php artisan event:cache
    - cd /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za && php artisan icons:cache
    - cd /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za && php artisan filament:cache-components
    - cd /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za && php artisan storage:link 2>/dev/null || true
    - cd /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za && php artisan queue:restart
