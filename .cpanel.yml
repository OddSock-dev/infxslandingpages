---
deployment:
  tasks:
    - cp -R app /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/
    - cp -R bootstrap /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/
    - cp -R config /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/
    - cp -R database /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/
    - cp -R public /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/
    - cp -R resources /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/
    - cp -R routes /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/
    - cp artisan /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/artisan
    - cp composer.json /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/composer.json
    - cp composer.lock /home/infxsolutionsco/public_html/zoho.infxsolutions.co.za/composer.lock
    - /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction --working-dir=/home/infxsolutionsco/public_html/zoho.infxsolutions.co.za
