---
deployment:
  tasks:
    - export DEPLOYPATH=/home/infxsolutionsco/public_html/zoho.infxsolutions.co.za

    # Copy application directories (overwrites in place, never deletes first)
    - /bin/cp -R $REPOROOT/app $DEPLOYPATH/
    - /bin/cp -R $REPOROOT/bootstrap $DEPLOYPATH/
    - /bin/cp -R $REPOROOT/config $DEPLOYPATH/
    - /bin/cp -R $REPOROOT/database $DEPLOYPATH/
    - /bin/cp -R $REPOROOT/public $DEPLOYPATH/
    - /bin/cp -R $REPOROOT/resources $DEPLOYPATH/
    - /bin/cp -R $REPOROOT/routes $DEPLOYPATH/

    # Copy application root files
    - /bin/cp $REPOROOT/artisan $DEPLOYPATH/artisan
    - /bin/cp $REPOROOT/composer.json $DEPLOYPATH/composer.json
    - /bin/cp $REPOROOT/composer.lock $DEPLOYPATH/composer.lock

    # Ensure storage directory structure exists
    - /bin/mkdir -p $DEPLOYPATH/storage/framework/cache
    - /bin/mkdir -p $DEPLOYPATH/storage/framework/sessions
    - /bin/mkdir -p $DEPLOYPATH/storage/framework/views
    - /bin/mkdir -p $DEPLOYPATH/storage/logs
    - /bin/mkdir -p $DEPLOYPATH/storage/app/public

    # Install PHP dependencies
    - /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction --working-dir=$DEPLOYPATH

    # Run database migrations
    - cd $DEPLOYPATH && php artisan migrate --force

    # Clear and rebuild caches
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache
    - cd $DEPLOYPATH && php artisan event:cache
    - cd $DEPLOYPATH && php artisan icons:cache
    - cd $DEPLOYPATH && php artisan filament:cache-components

    # Link public storage if not already linked
    - cd $DEPLOYPATH && php artisan storage:link 2>/dev/null || true

    # Restart queue workers to pick up new code
    - cd $DEPLOYPATH && php artisan queue:restart
